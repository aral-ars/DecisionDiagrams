name: CI

on:
  push:
    branches: [main, devel]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            preset: windows-msvc-release

          - name: Linux GCC
            os: ubuntu-latest
            preset: linux-release

          - name: Linux Clang
            os: ubuntu-latest
            preset: linux-clang-release

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
